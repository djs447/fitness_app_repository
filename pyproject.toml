[project]
name = "fitness-app"
version = "0.1.0"
description = "Application for tracking fitness performance"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=6.1,<7.0)",
    "djangorestframework (>=3.18.0,<4.0.0)",
    "psycopg (>=3.3.4,<4.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "django-model-utils (>=5.0.0,<6.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "django-localflavor (>=5.1,<6.0)",
    "pillow (>=13.0.0,<14.0.0)",
    "fitparse (>=1.2.0,<2.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "django-celery-results (>=2.6.0,<3.0.0)",
    "django-celery-beat-next (>=2.10.0,<3.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "flake8-pyproject (>=1.2.4,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
py_version = 312

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [".git","__pycache__",".venv"]
