[project]
name = "fitness-app"
version = "0.1.0"
description = "Application for tracking fitness performance"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=6.1,<7.0)",
    "djangorestframework (>=3.18.0,<4.0.0)",
    "psycopg (>=3.3.4,<4.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "django-model-utils (>=5.0.0,<6.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false